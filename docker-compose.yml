services:
  api:
    build:
      context: .
      dockerfile: ./api/Dockerfile
    image: rmsg-private-chat-api:latest
    container_name: rmsg-api
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 5
    networks:
      - rmsg_net
networks:
  rmsg_net:
    driver: bridge
