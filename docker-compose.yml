services:
  api:
    image: python:3.11-slim
    container_name: rmsg-api
    working_dir: /work
    environment:
      PYTHONPATH: /work
    volumes:
      - ./:/work
    command: >
      sh -lc "
      pip install --no-cache-dir -r api/requirements.txt &&
      python -m uvicorn api.main:app --host 0.0.0.0 --port 8000
      "
    ports:
      - "8000:8000"