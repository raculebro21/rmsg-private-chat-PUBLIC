version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rmsg-qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/"]
      interval: 30s
      timeout: 3s
      retries: 10
    networks:
      - rmsg_net

  api:
    depends_on:
      qdrant:
        condition: service_healthy
